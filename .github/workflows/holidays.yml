name: holidays

# Second system: "holidays - economy" (see CLAUDE.md). Fully separate from the business
# scan: own runner (so Google's rate limit is counted separately), own concurrency group,
# own data (data/holidays/). Stage 1: measurement only (holiday_probe.py).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = one-off measurement, diag = calendar diagnosis"
        default: "probe"
      quick:
        description: "quick probe (2 destinations)"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths: ["holiday_probe.py", "holiday_diag.py", "fli_multi.py", ".github/workflows/holidays.yml"]

permissions:
  contents: write

concurrency:
  group: holidays
  cancel-in-progress: false

jobs:
  holidays:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-holidays.txt
      - name: tests
        run: python test_holidays.py
      - name: probe
        run: |
          if [ "${{ inputs.mode || 'diag' }}" = "diag" ]; then python holiday_diag.py; else python holiday_probe.py ${{ inputs.quick && '--quick' || '' }}; fi
      - name: save probe report
        if: always()
        run: |
          git config user.name "biz-fare-alert"
          git config user.email "actions@users.noreply.github.com"
          git add data/holidays || true
          git diff --cached --quiet || git commit -m "holidays: probe report $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
