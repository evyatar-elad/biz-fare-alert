name: scan

on:
  schedule:
    - cron: "23 * * * *"   # every hour (public repo: unlimited minutes)
  workflow_dispatch:
    inputs:
      minutes:
        description: "time budget (minutes)"
        default: "45"
      only:
        description: "only these destinations, e.g. SGN,DPS (empty = all)"
        default: ""
      test_email:
        description: "only send a sample email (no search)"
        type: boolean
        default: false
      dry_run:
        description: "print emails instead of sending"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: scan
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then python notify.py --test; exit $?; fi
          python scanner.py --minutes "${{ inputs.minutes || '45' }}" --only "${{ inputs.only }}" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: newsletters
        if: always() && inputs.test_email != true
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_USER: ${{ secrets.NEWS_USER }}
          NEWS_PASS: ${{ secrets.NEWS_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python newsletters.py
      - name: daily digest
        if: always() && inputs.test_email != true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python digest.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: status page
        if: always()
        run: python status.py || true
      - name: save state
        if: always()
        run: |
          git config user.name "biz-fare-alert"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: scan $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      # GitHub's hourly schedule is unreliable (did not fire at all in the first hours),
      # so each run queues the next one, at least ~55 minutes after this one started.
      # (workflow_dispatch from GITHUB_TOKEN is allowed to start a new run.)
      - name: queue next run
        if: always() && inputs.test_email != true && inputs.only == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 55*60 - ($(date +%s) - JOB_START) ))
          if [ $left -gt 0 ]; then echo "waiting $left s"; sleep $left; fi
          gh workflow run scan.yml --ref main
