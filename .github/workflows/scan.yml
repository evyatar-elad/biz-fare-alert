name: scan

on:
  schedule:
    - cron: "23 */2 * * *"   # every 2 hours
  workflow_dispatch:
    inputs:
      minutes:
        description: "time budget (minutes)"
        default: "20"
      only:
        description: "only these destinations, e.g. SGN,DPS (empty = all)"
        default: ""
      dry_run:
        description: "print emails instead of sending"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: scan
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scanner.py --minutes "${{ inputs.minutes || '20' }}" --only "${{ inputs.only }}" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: save state
        if: always()
        run: |
          git config user.name "biz-fare-alert"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: scan $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
